<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
    .participant { font-size: 14px; font-weight: 600; fill: #111827; }
    .subtitle { font-size: 11px; fill: #6b7280; }
    .message { font-size: 12px; fill: #374151; }
    .step { font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">普通模型调用链：Controller 到大模型</text>
  <text x="480" y="54" text-anchor="middle" fill="#6b7280" font-size="12">同步接口 /api/ai/love_app/chat/sync 的一次完整调用</text>

  <!-- Participants -->
  <g filter="url(#shadow)">
    <rect x="20" y="76" width="120" height="64" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="180" y="76" width="120" height="64" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="340" y="76" width="120" height="64" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="500" y="76" width="120" height="64" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
    <rect x="660" y="76" width="120" height="64" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2.2"/>
    <rect x="663" y="79" width="114" height="58" rx="8" fill="none" stroke="#c084fc" stroke-width="0.8"/>
    <rect x="820" y="76" width="120" height="64" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  </g>

  <text x="80" y="104" text-anchor="middle" class="participant">用户 / 浏览器</text>
  <text x="80" y="123" text-anchor="middle" class="subtitle">HTTP Client</text>
  <text x="240" y="104" text-anchor="middle" class="participant">AiController</text>
  <text x="240" y="123" text-anchor="middle" class="subtitle">接口层</text>
  <text x="400" y="104" text-anchor="middle" class="participant">LoveApp</text>
  <text x="400" y="123" text-anchor="middle" class="subtitle">应用层</text>
  <text x="560" y="104" text-anchor="middle" class="participant">ChatClient</text>
  <text x="560" y="123" text-anchor="middle" class="subtitle">Spring AI</text>
  <text x="720" y="102" text-anchor="middle" class="participant">DashScope</text>
  <text x="720" y="121" text-anchor="middle" class="subtitle">ChatModel</text>
  <text x="880" y="104" text-anchor="middle" class="participant">百炼大模型</text>
  <text x="880" y="123" text-anchor="middle" class="subtitle">qwen-plus</text>

  <!-- Lifelines -->
  <g stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="6,5">
    <line x1="80" y1="140" x2="80" y2="550"/>
    <line x1="240" y1="140" x2="240" y2="550"/>
    <line x1="400" y1="140" x2="400" y2="550"/>
    <line x1="560" y1="140" x2="560" y2="550"/>
    <line x1="720" y1="140" x2="720" y2="550"/>
    <line x1="880" y1="140" x2="880" y2="550"/>
  </g>

  <!-- Step badges -->
  <g>
    <circle cx="92" cy="171" r="11" fill="#2563eb"/><text x="92" y="175" text-anchor="middle" class="step">1</text>
    <circle cx="252" cy="226" r="11" fill="#2563eb"/><text x="252" y="230" text-anchor="middle" class="step">2</text>
    <circle cx="412" cy="281" r="11" fill="#2563eb"/><text x="412" y="285" text-anchor="middle" class="step">3</text>
    <circle cx="572" cy="336" r="11" fill="#2563eb"/><text x="572" y="340" text-anchor="middle" class="step">4</text>
    <circle cx="732" cy="391" r="11" fill="#2563eb"/><text x="732" y="395" text-anchor="middle" class="step">5</text>
  </g>

  <!-- Request flow -->
  <g fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)">
    <line x1="80" y1="171" x2="232" y2="171"/>
    <line x1="240" y1="226" x2="392" y2="226"/>
    <line x1="400" y1="281" x2="552" y2="281"/>
    <line x1="560" y1="336" x2="712" y2="336"/>
    <line x1="720" y1="391" x2="872" y2="391"/>
  </g>

  <!-- Request labels with backgrounds -->
  <g>
    <rect x="105" y="151" width="113" height="17" rx="3" fill="#ffffff" opacity="0.95"/>
    <text x="161" y="164" text-anchor="middle" class="message">GET message, chatId</text>
    <rect x="273" y="206" width="94" height="17" rx="3" fill="#ffffff" opacity="0.95"/>
    <text x="320" y="219" text-anchor="middle" class="message">doChat(...)</text>
    <rect x="427" y="261" width="106" height="17" rx="3" fill="#ffffff" opacity="0.95"/>
    <text x="480" y="274" text-anchor="middle" class="message">prompt + user</text>
    <rect x="589" y="316" width="94" height="17" rx="3" fill="#ffffff" opacity="0.95"/>
    <text x="636" y="329" text-anchor="middle" class="message">ChatResponse</text>
    <rect x="752" y="371" width="88" height="17" rx="3" fill="#ffffff" opacity="0.95"/>
    <text x="796" y="384" text-anchor="middle" class="message">模型请求</text>
  </g>

  <!-- Response flow -->
  <g fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-green)">
    <line x1="880" y1="438" x2="728" y2="438"/>
    <line x1="720" y1="468" x2="568" y2="468"/>
    <line x1="560" y1="498" x2="408" y2="498"/>
    <line x1="400" y1="528" x2="248" y2="528"/>
    <line x1="240" y1="558" x2="88" y2="558"/>
  </g>

  <!-- Response labels with backgrounds -->
  <g>
    <rect x="758" y="418" width="92" height="17" rx="3" fill="#ffffff" opacity="0.95"/>
    <text x="804" y="431" text-anchor="middle" class="message">生成文本</text>
    <rect x="596" y="448" width="96" height="17" rx="3" fill="#ffffff" opacity="0.95"/>
    <text x="644" y="461" text-anchor="middle" class="message">模型响应</text>
    <rect x="436" y="478" width="96" height="17" rx="3" fill="#ffffff" opacity="0.95"/>
    <text x="484" y="491" text-anchor="middle" class="message">ChatResponse</text>
    <rect x="277" y="508" width="94" height="17" rx="3" fill="#ffffff" opacity="0.95"/>
    <text x="324" y="521" text-anchor="middle" class="message">String content</text>
    <rect x="115" y="538" width="100" height="17" rx="3" fill="#ffffff" opacity="0.95"/>
    <text x="165" y="551" text-anchor="middle" class="message">HTTP 200 文本</text>
  </g>

  <!-- Legend -->
  <g transform="translate(32,592)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="42" y="4" fill="#6b7280" font-size="12">请求方向</text>
    <line x1="130" y1="0" x2="162" y2="0" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
    <text x="172" y="4" fill="#6b7280" font-size="12">响应方向</text>
  </g>
</svg>
